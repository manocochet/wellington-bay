<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F7F3EA;color:#14213D;font-family:'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}a{color:#1F3567;text-decoration:none}a:hover{color:#B8861C}*{box-sizing:border-box}</style>
<script src="fx.js"></script>
</helmet>
<header style="position:relative;z-index:20;font-family:'Public Sans',system-ui,sans-serif">
  <div style="background:#16264A;color:#E9EDF5;font-size:13px">
    <div style="max-width:1320px;margin:0 auto;padding:8px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px"><span style="color:#E2AC32">✷</span><span>Site officiel de la Ville de Wellington Bay · Comté de Brown, Wisconsin</span></div>
      <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">
        <a href="Mairie.dc.html" style="color:#E9EDF5" style-hover="color:#F0C462">Mairie &amp; services</a>
        <a href="Mairie.dc.html#actualites" style="color:#E9EDF5" style-hover="color:#F0C462">Actualités</a>
        <a href="Mairie.dc.html#contact" style="color:#E9EDF5" style-hover="color:#F0C462">Contact</a>
        <span style="display:flex;gap:6px;font-weight:700;letter-spacing:.04em"><span style="color:#F0C462">FR</span><span style="opacity:.5">/</span><span>EN</span></span>
      </div>
    </div>
  </div>
  <div style="background:#FFFFFF;position:relative">
    <div style="max-width:1320px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px">
      <a href="Accueil.dc.html" style="display:flex;align-items:center;gap:14px;color:#14213D;flex:none">
        <img src="img/logo.png" alt="Emblème de Wellington Bay" style="width:54px;height:54px;display:block;transition:rotate .8s cubic-bezier(.2,.7,.2,1)" style-hover="rotate:-12deg">
        <span style="display:flex;flex-direction:column;line-height:1">
          <span style="font-family:'Source Serif 4',Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:#1F3567">Wellington Bay</span>
          <span style="font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8A6A1E;margin-top:6px">The Bay City · Wisconsin</span>
        </span>
      </a>
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
        <nav style="display:flex;align-items:center;gap:2px">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
            <a href="{{ n.href }}" style="position:relative;padding:10px 12px;white-space:nowrap;font-size:15px;font-weight:600;color:{{ n.color }};border-bottom:3px solid {{ n.border }}" style-hover="color:#1F3567;border-bottom-color:#E2AC32">{{ n.label }}</a>
          </sc-for>
          <a href="Carte.dc.html" style="margin-left:12px;white-space:nowrap;padding:11px 26px 11px 18px;background:#1F3567;color:#FFFFFF;font-size:14px;font-weight:700;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)" style-hover="background:#E2AC32;color:#14213D">Planifier sa visite</a>
        </nav>
      </sc-if>
      <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ toggle }}" aria-label="Menu" style="display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid #1F3567;background:{{ burgerBg }};color:{{ burgerFg }};font:700 14px 'Public Sans',sans-serif;cursor:pointer;letter-spacing:.06em;text-transform:uppercase">
          <span style="display:flex;flex-direction:column;gap:4px;width:18px"><span style="height:2px;background:currentColor;transition:transform .3s;transform:{{ l1 }}"></span><span style="height:2px;background:currentColor;transition:opacity .2s;opacity:{{ l2 }}"></span><span style="height:2px;background:currentColor;transition:transform .3s;transform:{{ l3 }}"></span></span>
          <span>{{ burgerLabel }}</span>
        </button>
      </sc-if>
    </div>
    <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:100%;background:#FFFFFF;border-top:1px solid #ECE6D8;box-shadow:0 24px 40px rgba(20,33,61,.18);z-index:30">
        <nav style="max-width:1320px;margin:0 auto;padding:12px 32px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 32px">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
            <a href="{{ n.href }}" style="display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #ECE6D8;font-family:'Source Serif 4',Georgia,serif;font-size:24px;font-weight:600;color:{{ n.color }}" style-hover="color:#B8861C"><span>{{ n.label }}</span><span style="color:#E2AC32;font-size:18px">→</span></a>
          </sc-for>
          <a href="Mairie.dc.html" style="display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #ECE6D8;font-family:'Source Serif 4',Georgia,serif;font-size:24px;font-weight:600;color:#14213D" style-hover="color:#B8861C"><span>Mairie &amp; services</span><span style="color:#E2AC32;font-size:18px">→</span></a>
        </nav>
      </div>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column">
    <div style="height:5px;background:#E2AC32"></div>
    <div style="height:3px;background:#FFFFFF"></div>
    <div style="height:5px;background:#1F3567"></div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:160},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ville&quot;,&quot;districts&quot;,&quot;carte&quot;,&quot;sortir&quot;,&quot;agenda&quot;,&quot;transports&quot;,&quot;economie&quot;,&quot;mairie&quot;],&quot;default&quot;:&quot;ville&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1400, open: false };
  componentDidMount() { this._r = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this._r); }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const a = this.props.active;
    const items = [
      ['ville','Découvrir','La-Ville.dc.html'],['districts','Districts','Districts.dc.html'],['carte','La carte','Carte.dc.html'],
      ['sortir','Sortir','Sortir.dc.html'],['agenda','Agenda','Agenda.dc.html'],['transports','Se déplacer','Se-deplacer.dc.html'],['economie','Économie','Economie.dc.html']
    ];
    const wide = this.state.w >= 1240, open = !wide && this.state.open;
    return {
      wide, narrow: !wide, open,
      toggle: () => this.setState(s => ({ open: !s.open })),
      burgerLabel: open ? 'Fermer' : 'Menu',
      burgerBg: open ? '#1F3567' : '#FFFFFF', burgerFg: open ? '#FFFFFF' : '#1F3567',
      l1: open ? 'translateY(6px) rotate(45deg)' : 'none', l2: open ? 0 : 1, l3: open ? 'translateY(-6px) rotate(-45deg)' : 'none',
      nav: items.map(([k,label,href]) => ({ label, href, border: k === a ? '#E2AC32' : 'transparent', color: k === a ? '#1F3567' : '#14213D' }))
    };
  }
}
</script>
</body>
</html>
